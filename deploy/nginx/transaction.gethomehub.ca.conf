server {
    listen 80;
    server_name transaction.gethomehub.ca;

    return 308 https://$host$request_uri;
}

server {
		listen 443 ssl http2;
    server_name transaction.gethomehub.ca;
        return 308 https://gethomehub.ca$request_uri;

    ssl_certificate     /www/server/panel/vhost/cert/transaction.gethomehub.ca/fullchain.pem;
ssl_certificate_key /www/server/panel/vhost/cert/transaction.gethomehub.ca/privkey.pem;

    root /www/wwwroot/crm_node/client/dist;
    index index.html;

    access_log /www/wwwlogs/transaction.gethomehub.ca.log;
    error_log /www/wwwlogs/transaction.gethomehub.ca.error.log;

    # React SPA
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # TD-062. REPORT-ONLY ON PURPOSE - this blocks nothing. The documents the browser
        # actually renders carried no CSP, while the full policy sat on /api/, which returns
        # JSON and renders nothing. Report-only collects the real violations from a working
        # app before anything is enforced; a policy guessed up front is how a single-page app
        # goes blank for everybody at once.
        # TD-062. ENFORCED. Evidence for script-src 'self': index.html carries ZERO inline
        # scripts and exactly one script, /assets/index-*.js, served from this host - so the
        # rule that actually stops injected code blocks nothing legitimate.
        # GOOGLE FONTS IS NAMED EXPLICITLY because the app loads a stylesheet from
        # fonts.googleapis.com and its faces from fonts.gstatic.com. The report-only pass
        # showed no violation for it ONLY because that stylesheet was already cached;
        # enforcing without these two origins would have killed the fonts site-wide.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://photon.komoot.io https://*.twilio.com wss://*.twilio.com; object-src 'none'; frame-src 'self' blob: data:" always;
        # And a STRICTER policy still in report-only, so the remaining two can be tightened
        # on evidence rather than on a guess: object-src 'none' and connect-src 'self'.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'" always;

        try_files $uri $uri/ /index.html;
    }
    
    
    location /sanctum/ {
    proxy_pass http://127.0.0.1:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        # TD-062. This regex location wins over "location /", and it defined no add_header of
        # its own. nginx does not copy add_header across from a sibling location, so the
        # application's own JavaScript was served with no security headers at all.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        expires 30d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}

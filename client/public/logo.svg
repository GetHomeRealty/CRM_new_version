<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" font-family="Georgia,'Times New Roman',serif">
  <!-- icon: umbrella + house + pole -->
  <g transform="translate(212,6)">
    <!-- pole -->
    <rect x="35" y="12" width="5" height="90" rx="2" fill="#141414"/>
    <!-- hand grip at the bottom of the pole -->
    <path d="M34 98 q-11 3 -8 14 q3 8 12 4 q6 -3 3 -11 q-2 -5 -7 -7 z" fill="#141414"/>
    <!-- umbrella canopy with a scalloped lower edge -->
    <path d="M2 46 C4 12 72 12 74 46 C66 39 62 46 57 46 C52 39 47 46 42 46 C37 39 32 46 27 46 C22 39 17 46 12 46 C8 43 5 44 2 46 Z" fill="#e30613"/>
    <!-- house sitting on the umbrella -->
    <path d="M18 24 L38 8 L58 24 Z" fill="#e30613"/>
    <path d="M22 22 L38 9 L54 22" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="32" y="16" width="12" height="9" fill="#e30613"/>
    <rect x="34" y="18" width="3" height="2.6" fill="#ffffff"/>
    <rect x="39" y="18" width="3" height="2.6" fill="#ffffff"/>
    <rect x="34" y="21.5" width="3" height="2.6" fill="#ffffff"/>
    <rect x="39" y="21.5" width="3" height="2.6" fill="#ffffff"/>
  </g>
  <!-- wordmark -->
  <text x="280" y="116" text-anchor="middle" fill="#e30613" font-weight="bold" letter-spacing="0.5">
    <tspan font-size="62">G</tspan><tspan font-size="46">ET</tspan><tspan font-size="46">  </tspan><tspan font-size="62">H</tspan><tspan font-size="46">OME</tspan><tspan font-size="46"> </tspan><tspan font-size="62">R</tspan><tspan font-size="46">EALTY</tspan>
  </text>
  <!-- tagline with side dashes -->
  <g fill="#141414">
    <rect x="152" y="132" width="28" height="3.5" rx="1"/>
    <text x="282" y="140" text-anchor="middle" font-size="17" font-style="italic" font-weight="bold">&#8220;A Tradition of Trust&#8221; - Brokerage</text>
    <rect x="384" y="132" width="28" height="3.5" rx="1"/>
  </g>
</svg>
